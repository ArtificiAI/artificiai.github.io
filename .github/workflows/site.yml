# Vérifie le site et le blogue, puis ajoute les fichiers générés aux pull requests.
# GitHub Pages publie ensuite la branche main telle quelle (fichiers générés compris).
name: Vérifier et générer le site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: site-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pour une pull request : la branche elle-même, afin de pouvoir y ajouter les fichiers générés.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tests du blogue
        run: npm test

      - name: Générer le site (validation des articles comprise)
        run: npm run build

      - name: Ajouter les fichiers générés à la pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Mettre à jour les fichiers générés"
            git push
          fi

      - name: Vérifier que les fichiers générés sont à jour
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Les fichiers générés ne sont pas à jour : lancez npm run build et commitez le résultat."
            exit 1
          fi
