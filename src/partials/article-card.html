      <li class="py-10 first:pt-0 last:pb-0">
        <article class="relative">
          {{{cardImage}}}
          <p class="flex flex-wrap items-center gap-2 text-sm">
            <span class="rounded-full bg-primary-50 px-3 py-1 font-medium text-primary-700 ring-1 ring-primary-100 dark:bg-primary-800 dark:text-primary-100 dark:ring-primary-700">{{cardCategory}}</span>
            {{{cardBadges}}}
          </p>
          <h2 class="mt-4 text-2xl font-bold tracking-tight"{{{cardLangAttr}}}>
            <a href="{{cardUrl}}" class="after:absolute after:inset-0 hover:text-primary-500 dark:hover:text-primary-200">{{cardTitle}}</a>
          </h2>
          <p class="mt-3 leading-relaxed text-primary-700 dark:text-primary-200"{{{cardLangAttr}}}>{{cardDescription}}</p>
          <p class="mt-4 text-sm text-primary-600 dark:text-primary-300"><time datetime="{{cardDate}}">{{cardDateLabel}}</time> · {{cardAuthor}}</p>
        </article>
      </li>
